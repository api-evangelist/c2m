name: C2M
description: >-
  C2M A.S. is the company behind Connected2.me, a consumer mobile messaging and
  social application that lets people create a profile, receive messages, and
  chat in real time with new contacts around the world. The app supports
  anonymous and identified conversations, following friends, and online-status
  notifications, and is distributed on both iOS (App Store) and Android (Google
  Play). Connected2.me is a consumer-facing product with no public developer
  program, API, or SDK surface at this time; its published surface is limited to
  the marketing site, the mobile apps, and its legal documents (Terms of Service
  and Privacy Policy). C2M was surfaced as a portfolio company of 500 Global and
  added to the API Evangelist network.
